name: EasyFlow frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/easyflow-frontend-worker-alignment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend syntax and safety invariants
        run: node scripts/check-frontend.cjs
