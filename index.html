<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excel EasyFlow</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f3ff;
  color: #333;
}

header {
  background: linear-gradient(135deg, #6a5acd, #8a2be2);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

header h1 {
  margin: 0;
  font-size: 42px;
}

header p {
  font-size: 18px;
  margin: 12px auto 0;
  max-width: 650px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 35px 18px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 18px;
  margin-bottom: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h2 {
  color: #5b4bc4;
  margin-top: 0;
}

h3 {
  color: #5b4bc4;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 9px;
  padding: 13px 20px;
  font-size: 16px;
  font-weight: bold;
}

.primary {
  background: #6a5acd;
  color: white;
  width: 100%;
  margin-top: 25px;
}

.primary:hover {
  background: #5848c2;
}

.add {
  background: #eeeaff;
  color: #5b4bc4;
  margin-top: 20px;
  width: 100%;
}

.remove {
  background: #ffe8e8;
  color: #c0392b;
  margin-top: 15px;
  width: 100%;
}

.download {
  background: #8a2be2;
  color: white;
  width: 100%;
  margin-top: 20px;
}

.tool-card {
  margin-top: 25px;
}

.tool
